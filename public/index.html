<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Gateway</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #005E86;
      --sky:    #1D9ED9;
      --mid:    #1C75BC;
      --cyan:   #67C9D3;
      --orange: #F05123;
      --bg:     #F0F4F8;
      --surface:#FFFFFF;
      --text:   #1A2332;
      --muted:  #6B7A8D;
      --border: #DDE3EA;
      --green:  #22C55E;
      --red:    #EF4444;
      --yellow: #F59E0B;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #root { min-height: 100vh; }

    /* ── Layout ── */
    .app-shell { display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 240px; background: var(--navy); display: flex; flex-direction: column; flex-shrink: 0; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar-logo { padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,.12); }
    .sidebar-logo h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
    .sidebar-logo p  { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 2px; }
    .sidebar-nav { padding: 12px 8px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,.7); font-size: 13px; font-weight: 500; transition: all .15s; margin-bottom: 2px; }
    .nav-item:hover { background: rgba(255,255,255,.1); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,.15); color: #fff; }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-footer { padding: 16px; border-top: 1px solid rgba(255,255,255,.12); }
    .user-chip { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--sky); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 10px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .5px; }
    .logout-btn { background: none; border: none; color: rgba(255,255,255,.5); cursor: pointer; font-size: 16px; padding: 4px; }
    .logout-btn:hover { color: #fff; }

    /* ── Top bar ── */
    .topbar { padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .topbar h2 { font-size: 16px; font-weight: 600; }
    .topbar-meta { font-size: 12px; color: var(--muted); }

    /* ── Content area ── */
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* ── Login ── */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--navy) 0%, var(--mid) 100%); }
    .login-card { background: #fff; border-radius: 16px; padding: 40px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,60,.25); }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo h1 { font-size: 22px; font-weight: 800; color: var(--navy); }
    .login-logo p  { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .field input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; transition: border-color .15s; }
    .field input:focus { border-color: var(--sky); }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
    .btn-primary { background: var(--sky); color: #fff; }
    .btn-primary:hover { background: var(--mid); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--sky); border: 1.5px solid var(--sky); }
    .btn-outline:hover { background: var(--sky); color: #fff; }
    .btn-danger  { background: var(--red); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-ghost   { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--sky); color: var(--sky); }
    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .btn-full { width: 100%; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-green:hover { background: #16a34a; }

    /* ── Cards ── */
    .card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .card-body { padding: 20px; }

    /* ── Stat cards ── */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .stat-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-sub   { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat-accent { color: var(--sky); }

    /* ── Progress bars ── */
    .quota-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .quota-card { background: var(--surface); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--border); }
    .quota-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .quota-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
    .quota-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
    .quota-numbers { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
    .fill-ok   { background: var(--green); }
    .fill-warn { background: var(--yellow); }
    .fill-over { background: var(--red); }

    /* ── Chat ── */
    .chat-wrap { display: flex; flex-direction: column; height: 100%; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .msg { display: flex; gap: 10px; max-width: 720px; }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; margin-top: 2px; }
    .msg-avatar.bot { background: var(--sky); color: #fff; }
    .msg-avatar.user { background: var(--orange); color: #fff; }
    .msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; max-width: 560px; }
    .msg.bot  .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 2px 12px 12px 12px; }
    .msg.user .msg-bubble { background: var(--sky); color: #fff; border-radius: 12px 2px 12px 12px; }
    .msg-cost { font-size: 10px; color: var(--muted); margin-top: 4px; text-align: right; }
    .chat-input-area { padding: 16px 24px; background: var(--surface); border-top: 1px solid var(--border); }
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input { flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; resize: none; outline: none; font-family: inherit; max-height: 120px; }
    .chat-input:focus { border-color: var(--sky); }
    .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0) } 30% { transform: translateY(-6px) } }
    .empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 8px; }
    .empty-chat .big-icon { font-size: 40px; opacity: .3; }
    .empty-chat p { font-size: 14px; }

    /* ── Admin table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--border); }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-red   { background: #fee2e2; color: #dc2626; }
    .badge-yellow{ background: #fef9c3; color: #ca8a04; }
    .progress-cell { display: flex; align-items: center; gap: 8px; }
    .mini-bar { flex: 1; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; min-width: 60px; }
    .mini-fill { height: 100%; border-radius: 99px; }
    .actions { display: flex; gap: 6px; }

    /* ── Modal ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #fff; border-radius: 16px; width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
    .close-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--muted); padding: 2px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .help-text { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 200; animation: slideUp .2s ease; }
    .toast.error { background: var(--red); }
    .toast.success { background: var(--green); }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ── Alert ── */
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .alert-red { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-blue { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

    /* ── Error ── */
    .error-text { color: var(--red); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── API helper ────────────────────────────────────────────────
const api = {
  async call(method, path, body, token) {
    const res = await fetch(path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error desconocido');
    return data;
  },
  get:  (path, token)       => api.call('GET',    path, null, token),
  post: (path, body, token) => api.call('POST',   path, body, token),
  put:  (path, body, token) => api.call('PUT',    path, body, token),
  del:  (path, token)       => api.call('DELETE', path, null, token),
};

// ── Helpers ───────────────────────────────────────────────────
const fmt = (n) => `$${Number(n).toFixed(4)}`;
const pct = (used, limit) => Math.min((used / limit) * 100, 100);
const fillClass = (p) => p >= 90 ? 'fill-over' : p >= 70 ? 'fill-warn' : 'fill-ok';

function QuotaBar({ label, used, limit }) {
  const p = pct(used, limit);
  return (
    <div className="quota-card">
      <div className="quota-label">
        <span>{label}</span>
        <span style={{ color: p >= 90 ? 'var(--red)' : 'inherit' }}>
          {p.toFixed(0)}%
        </span>
      </div>
      <div className="quota-bar">
        <div className={`quota-fill ${fillClass(p)}`} style={{ width: `${p}%` }} />
      </div>
      <div className="quota-numbers">
        <span>Usado: {fmt(used)}</span>
        <span>Límite: {fmt(limit)}</span>
      </div>
    </div>
  );
}

function Toast({ msg, type, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, 3000);
    return () => clearTimeout(t);
  }, []);
  return <div className={`toast ${type}`}>{msg}</div>;
}

// ── Login ─────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [email, setEmail]     = useState('');
  const [password, setPass]   = useState('');
  const [error, setError]     = useState('');
  const [loading, setLoading] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError(''); setLoading(true);
    try {
      const data = await api.post('/api/auth/login', { email, password });
      onLogin(data.token, data.user);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">
          <h1>🤖 Claude Gateway</h1>
          <p>Acceso con IA para tu equipo</p>
        </div>
        <form onSubmit={submit}>
          <div className="field">
            <label>Correo electrónico</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
              placeholder="tu@empresa.com" autoFocus required />
          </div>
          <div className="field">
            <label>Contraseña</label>
            <input type="password" value={password} onChange={e => setPass(e.target.value)}
              placeholder="••••••••" required />
          </div>
          {error && <div className="alert alert-red">{error}</div>}
          <button className="btn btn-primary btn-full" type="submit" disabled={loading}>
            {loading ? 'Ingresando…' : 'Ingresar'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── Chat (worker view) ────────────────────────────────────────
function ChatPage({ token, user, me, onRefreshMe }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState('');
  const bottomRef = useRef(null);

  useEffect(() => {
    api.get('/api/messages', token).then(msgs => {
      setMessages(msgs.map(m => ({ role: m.role, content: m.content, cost: m.cost_usd })));
    }).catch(() => {});
  }, []);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, loading]);

  async function send() {
    const text = input.trim();
    if (!text || loading) return;
    setInput(''); setError('');

    const newMessages = [...messages, { role: 'user', content: text }];
    setMessages(newMessages);
    setLoading(true);

    try {
      const payload = newMessages.map(m => ({ role: m.role, content: m.content }));
      const res = await api.post('/api/chat', { messages: payload }, token);
      setMessages([...newMessages, { role: 'assistant', content: res.content, cost: res.usage.cost_usd }]);
      onRefreshMe();
    } catch (err) {
      setError(err.message);
      setMessages(newMessages.slice(0, -1));
    } finally {
      setLoading(false);
    }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return (
    <div className="chat-wrap">
      {/* Quota bars at top */}
      <div style={{ padding: '16px 24px 0', background: 'var(--bg)' }}>
        <div className="quota-section">
          <QuotaBar label="Consumo hoy" used={me.daily_used} limit={me.daily_limit_usd} />
          <QuotaBar label="Consumo este mes" used={me.monthly_used} limit={me.monthly_limit_usd} />
        </div>
      </div>

      {/* Messages */}
      <div className="chat-messages">
        {messages.length === 0 && !loading && (
          <div className="empty-chat">
            <div className="big-icon">💬</div>
            <p>Escribe un mensaje para comenzar</p>
          </div>
        )}
        {messages.map((m, i) => (
          <div key={i} className={`msg ${m.role === 'user' ? 'user' : 'bot'}`}>
            <div className={`msg-avatar ${m.role === 'user' ? 'user' : 'bot'}`}>
              {m.role === 'user' ? user.name[0].toUpperCase() : '✦'}
            </div>
            <div>
              <div className="msg-bubble" style={{ whiteSpace: 'pre-wrap' }}>{m.content}</div>
              {m.role === 'assistant' && m.cost > 0 && (
                <div className="msg-cost">{fmt(m.cost)}</div>
              )}
            </div>
          </div>
        ))}
        {loading && (
          <div className="msg bot">
            <div className="msg-avatar bot">✦</div>
            <div className="msg-bubble">
              <div className="typing-indicator">
                <div className="typing-dot"/><div className="typing-dot"/><div className="typing-dot"/>
              </div>
            </div>
          </div>
        )}
        {error && (
          <div className="alert alert-red" style={{ maxWidth: 560 }}>{error}</div>
        )}
        <div ref={bottomRef} />
      </div>

      {/* Input */}
      <div className="chat-input-area">
        <div className="chat-input-row">
          <textarea
            className="chat-input"
            rows={1}
            placeholder="Escribe tu mensaje… (Enter para enviar)"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKey}
            disabled={loading || me.daily_used >= me.daily_limit_usd || me.monthly_used >= me.monthly_limit_usd}
          />
          <button className="btn btn-primary" onClick={send} disabled={loading || !input.trim()}>
            {loading ? '…' : '↑'}
          </button>
        </div>
        {(me.daily_used >= me.daily_limit_usd || me.monthly_used >= me.monthly_limit_usd) && (
          <p className="error-text">Límite alcanzado. Contacta al administrador.</p>
        )}
      </div>
    </div>
  );
}

// ── User modal ────────────────────────────────────────────────
function UserModal({ user, onSave, onClose, token }) {
  const isNew = !user?.id;
  const [form, setForm] = useState(user || {
    name: '', email: '', password: '',
    daily_limit_usd: 1.00, monthly_limit_usd: 10.00, is_active: true,
  });
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState('');

  function set(k, v) { setForm(p => ({ ...p, [k]: v })); }

  async function save() {
    setError(''); setLoading(true);
    try {
      if (isNew) {
        await api.post('/api/admin/users', form, token);
      } else {
        await api.put(`/api/admin/users/${form.id}`, form, token);
      }
      onSave();
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title">{isNew ? 'Nuevo trabajador' : 'Editar trabajador'}</span>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label>Nombre completo</label>
            <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="Juan Pérez" />
          </div>
          <div className="field">
            <label>Correo electrónico</label>
            <input type="email" value={form.email} onChange={e => set('email', e.target.value)}
              placeholder="juan@empresa.com" disabled={!isNew} />
          </div>
          {isNew && (
            <div className="field">
              <label>Contraseña</label>
              <input type="password" value={form.password} onChange={e => set('password', e.target.value)}
                placeholder="Mínimo 6 caracteres" />
            </div>
          )}
          <div className="form-row">
            <div className="field">
              <label>Límite diario (USD)</label>
              <input type="number" step="0.50" min="0.10"
                value={form.daily_limit_usd}
                onChange={e => set('daily_limit_usd', parseFloat(e.target.value))} />
              <p className="help-text">Ej: $1.00 ≈ ~1,000 mensajes cortos</p>
            </div>
            <div className="field">
              <label>Límite mensual (USD)</label>
              <input type="number" step="1" min="1"
                value={form.monthly_limit_usd}
                onChange={e => set('monthly_limit_usd', parseFloat(e.target.value))} />
              <p className="help-text">Se resetea el 1 de cada mes</p>
            </div>
          </div>
          {!isNew && (
            <div className="field">
              <label>Estado</label>
              <select value={form.is_active ? '1' : '0'}
                onChange={e => set('is_active', e.target.value === '1')}
                style={{ width: '100%', padding: '10px 12px', border: '1.5px solid var(--border)', borderRadius: 8, fontSize: 14 }}>
                <option value="1">✅ Activo</option>
                <option value="0">🚫 Bloqueado</option>
              </select>
            </div>
          )}
          {error && <div className="alert alert-red">{error}</div>}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save} disabled={loading}>
            {loading ? 'Guardando…' : isNew ? 'Crear trabajador' : 'Guardar cambios'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Admin panel ───────────────────────────────────────────────
function AdminPage({ token }) {
  const [users, setUsers]     = useState([]);
  const [stats, setStats]     = useState(null);
  const [modal, setModal]     = useState(null); // null | {} | user object
  const [toast, setToast]     = useState(null);
  const [tab, setTab]         = useState('users');

  function showToast(msg, type = 'success') {
    setToast({ msg, type });
  }

  async function loadUsers() {
    const data = await api.get('/api/admin/users', token);
    setUsers(data);
  }

  async function loadStats() {
    const data = await api.get('/api/admin/stats', token);
    setStats(data);
  }

  useEffect(() => { loadUsers(); loadStats(); }, []);

  async function toggleActive(u) {
    await api.put(`/api/admin/users/${u.id}`, { ...u, is_active: !u.is_active }, token);
    showToast(u.is_active ? 'Usuario bloqueado' : 'Usuario activado');
    loadUsers();
  }

  return (
    <div className="content">
      {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
      {modal !== null && (
        <UserModal
          user={modal?.id ? modal : null}
          token={token}
          onSave={() => { setModal(null); loadUsers(); loadStats(); showToast('Guardado correctamente'); }}
          onClose={() => setModal(null)}
        />
      )}

      {/* Stats */}
      {stats && (
        <div className="stats-grid">
          <div className="stat-card">
            <div className="stat-label">Gasto hoy</div>
            <div className="stat-value stat-accent">{fmt(stats.total_today)}</div>
            <div className="stat-sub">USD</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">Gasto este mes</div>
            <div className="stat-value">{fmt(stats.total_month)}</div>
            <div className="stat-sub">USD</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">Trabajadores activos</div>
            <div className="stat-value">{stats.active_users}</div>
            <div className="stat-sub">usuarios</div>
          </div>
        </div>
      )}

      {/* Users table */}
      <div className="card">
        <div className="card-header">
          <span className="card-title">Trabajadores</span>
          <button className="btn btn-primary btn-sm" onClick={() => setModal({})}>
            + Nuevo trabajador
          </button>
        </div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Hoy</th>
                <th>Este mes</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              {users.filter(u => u.role === 'worker').map(u => {
                const dp = pct(u.daily_used, u.daily_limit_usd);
                const mp = pct(u.monthly_used, u.monthly_limit_usd);
                return (
                  <tr key={u.id}>
                    <td style={{ fontWeight: 600 }}>{u.name}</td>
                    <td style={{ color: 'var(--muted)', fontSize: 12 }}>{u.email}</td>
                    <td>
                      <span className={`badge ${u.is_active ? 'badge-green' : 'badge-red'}`}>
                        {u.is_active ? 'Activo' : 'Bloqueado'}
                      </span>
                    </td>
                    <td>
                      <div className="progress-cell">
                        <div className="mini-bar">
                          <div className={`mini-fill ${fillClass(dp)}`} style={{ width: `${dp}%` }} />
                        </div>
                        <span style={{ fontSize: 11, color: 'var(--muted)', whiteSpace: 'nowrap' }}>
                          {fmt(u.daily_used)} / {fmt(u.daily_limit_usd)}
                        </span>
                      </div>
                    </td>
                    <td>
                      <div className="progress-cell">
                        <div className="mini-bar">
                          <div className={`mini-fill ${fillClass(mp)}`} style={{ width: `${mp}%` }} />
                        </div>
                        <span style={{ fontSize: 11, color: 'var(--muted)', whiteSpace: 'nowrap' }}>
                          {fmt(u.monthly_used)} / {fmt(u.monthly_limit_usd)}
                        </span>
                      </div>
                    </td>
                    <td>
                      <div className="actions">
                        <button className="btn btn-outline btn-sm" onClick={() => setModal(u)}>
                          Editar
                        </button>
                        <button
                          className={`btn btn-sm ${u.is_active ? 'btn-danger' : 'btn-green'}`}
                          onClick={() => toggleActive(u)}
                        >
                          {u.is_active ? 'Bloquear' : 'Activar'}
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {users.filter(u => u.role === 'worker').length === 0 && (
                <tr>
                  <td colSpan={6} style={{ textAlign: 'center', color: 'var(--muted)', padding: 32 }}>
                    Aún no hay trabajadores — agrega el primero 👆
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {/* Per-user stats */}
      {stats?.per_user?.length > 0 && (
        <div className="card" style={{ marginTop: 20 }}>
          <div className="card-header">
            <span className="card-title">Consumo por trabajador (mes actual)</span>
          </div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Hoy</th>
                  <th>Este mes</th>
                  <th>Límite mensual</th>
                  <th>% del límite</th>
                </tr>
              </thead>
              <tbody>
                {stats.per_user.map((u, i) => {
                  const p = pct(u.month_cost, u.monthly_limit_usd);
                  return (
                    <tr key={i}>
                      <td style={{ fontWeight: 600 }}>{u.name}</td>
                      <td>{fmt(u.today_cost)}</td>
                      <td>{fmt(u.month_cost)}</td>
                      <td>{fmt(u.monthly_limit_usd)}</td>
                      <td>
                        <div className="progress-cell">
                          <div className="mini-bar" style={{ minWidth: 80 }}>
                            <div className={`mini-fill ${fillClass(p)}`} style={{ width: `${p}%` }} />
                          </div>
                          <span style={{ fontSize: 12 }}>{p.toFixed(0)}%</span>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Shell + routing ───────────────────────────────────────────
function App() {
  const [token, setToken]   = useState(() => localStorage.getItem('gw_token'));
  const [user, setUser]     = useState(() => {
    try { return JSON.parse(localStorage.getItem('gw_user')); } catch { return null; }
  });
  const [me, setMe]         = useState(null);
  const [page, setPage]     = useState('chat');

  function login(t, u) {
    setToken(t); setUser(u);
    localStorage.setItem('gw_token', t);
    localStorage.setItem('gw_user', JSON.stringify(u));
  }

  function logout() {
    setToken(null); setUser(null); setMe(null);
    localStorage.removeItem('gw_token');
    localStorage.removeItem('gw_user');
  }

  async function refreshMe() {
    if (!token) return;
    try {
      const data = await api.get('/api/me', token);
      setMe(data);
    } catch {
      logout();
    }
  }

  useEffect(() => { if (token) refreshMe(); }, [token]);

  if (!token || !user) return <LoginPage onLogin={login} />;
  if (!me) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', color: 'var(--muted)' }}>
      Cargando…
    </div>
  );

  const isAdmin = user.role === 'admin';
  const navItems = [
    { id: 'chat', icon: '💬', label: 'Chat' },
    ...(isAdmin ? [{ id: 'admin', icon: '⚙️', label: 'Administración' }] : []),
  ];

  return (
    <div className="app-shell">
      {/* Sidebar */}
      <aside className="sidebar">
        <div className="sidebar-logo">
          <h1>Claude Gateway</h1>
          <p>Asistente de equipo</p>
        </div>
        <nav className="sidebar-nav">
          {navItems.map(item => (
            <div key={item.id}
              className={`nav-item ${page === item.id ? 'active' : ''}`}
              onClick={() => setPage(item.id)}>
              <span className="nav-icon">{item.icon}</span>
              {item.label}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="user-chip">
            <div className="avatar">{user.name[0].toUpperCase()}</div>
            <div className="user-info">
              <div className="user-name">{user.name}</div>
              <div className="user-role">{user.role}</div>
            </div>
            <button className="logout-btn" onClick={logout} title="Cerrar sesión">↩</button>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="main">
        <div className="topbar">
          <h2>{page === 'chat' ? 'Asistente' : 'Panel de administración'}</h2>
          <span className="topbar-meta">Modelo: Claude Haiku 4.5</span>
        </div>

        {page === 'chat' && <ChatPage token={token} user={user} me={me} onRefreshMe={refreshMe} />}
        {page === 'admin' && isAdmin && <AdminPage token={token} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
